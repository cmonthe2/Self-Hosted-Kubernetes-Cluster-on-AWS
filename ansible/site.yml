---
# ─────────────────────────────────────────────────────────────────────────────
# site.yml — Master playbook
# Run:  ansible-playbook ansible/site.yml
# ─────────────────────────────────────────────────────────────────────────────

# ── Phase 1: Common setup (all nodes) ────────────────────────────────────────
- name: Common node configuration
  hosts: control_plane:worker
  gather_facts: true
  roles:
    - role: common

# ── Phase 2: Initialise the control plane ────────────────────────────────────
- name: Kubernetes control-plane bootstrap
  hosts: control_plane
  gather_facts: true
  roles:
    - role: control_plane

# ── Phase 3: Join worker nodes ────────────────────────────────────────────────
- name: Join worker nodes to the cluster
  hosts: worker
  gather_facts: true
  roles:
    - role: worker

# ── Phase 4: Deploy sample workload (runs on control-plane via kubectl) ───────
- name: Deploy sample nginx workload
  hosts: control_plane
  gather_facts: false
  collections:
    - kubernetes.core
  roles:
    - role: sample_workload
