# Dynamic inventory using the aws_ec2 plugin.
# Ansible groups nodes automatically based on the "Role" EC2 tag set by Terraform.
#
# Requirements:
#   pip install boto3 botocore
#   AWS credentials must be available (env vars, ~/.aws/credentials, or instance profile)

plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

# Only pick up instances that Terraform tagged as ManagedBy Terraform
filters:
  "tag:ManagedBy": Terraform
  instance-state-name: running

# Group by the "Role" tag Terraform sets.
# ec2_tags is the current key (tags is deprecated in amazon.aws 9+).
# The plugin sanitizes hyphens → underscores so:
#   "control-plane"  →  group: control_plane
#   "worker"         →  group: worker
keyed_groups:
  - key: ec2_tags.Role
    prefix: ""
    separator: ""

# Connection target per host:
#   control-plane → public IP (it's in a public subnet)
#   workers       → private IP (reached via ProxyCommand through control-plane)
# public_ip_address is None for workers, so fall back to private_ip_address.
compose:
  ansible_host: public_ip_address if public_ip_address else private_ip_address

# Keep the friendly Name tag as the inventory hostname so all three nodes
# appear distinctly. SSH routing is handled by ansible_host (the IP) plus the
# runner's ~/.ssh/config ProxyCommand which matches the worker Name pattern.
hostnames:
  - tag:Name

# ansible_user for all hosts
vars:
  ansible_user: ubuntu

# Cache results for 5 minutes to avoid hammering the AWS API during playbook runs
cache: true
cache_plugin: jsonfile
cache_timeout: 300
cache_connection: /tmp/aws_ec2_inventory_cache
