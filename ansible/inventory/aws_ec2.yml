# Dynamic inventory using the aws_ec2 plugin.
# Ansible groups nodes automatically based on the "Role" EC2 tag set by Terraform.
#
# Requirements:
#   pip install boto3 botocore
#   AWS credentials must be available (env vars, ~/.aws/credentials, or instance profile)

plugin: amazon.aws.aws_ec2

regions:
  - us-east-1

# Only pick up instances that Terraform tagged with our cluster name
filters:
  "tag:ManagedBy": Terraform
  instance-state-name: running

# Group by the "Role" tag Terraform sets.
# The plugin sanitizes hyphens → underscores so:
#   "control-plane"  →  group: control_plane
#   "worker"         →  group: worker
keyed_groups:
  - key: tags.Role
    prefix: ""
    separator: ""

# Use public IP for control-plane (public subnet), private IP for workers
# (private subnet — reached via ProxyJump through the control-plane).
# public_ip_address is None for workers so we fall back to private_ip_address.
compose:
  ansible_host: public_ip_address if public_ip_address else private_ip_address

hostnames:
  - tag:Name

# ansible_user for all hosts
vars:
  ansible_user: ubuntu

# Cache results for 5 minutes to avoid hammering the AWS API during playbook runs
cache: true
cache_plugin: jsonfile
cache_timeout: 300
cache_connection: /tmp/aws_ec2_inventory_cache
