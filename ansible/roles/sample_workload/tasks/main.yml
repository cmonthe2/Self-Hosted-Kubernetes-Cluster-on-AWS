---
# ─────────────────────────────────────────────────────────────────────────────
# sample_workload/tasks/main.yml
# Deploys an nginx Deployment + NodePort Service to prove the cluster works.
# Uses plain `kubectl apply` so no extra Python libraries are required on the
# control-plane node.
# ─────────────────────────────────────────────────────────────────────────────

- name: Render nginx manifests to the control-plane node
  template:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: "nginx-deployment.yml.j2", dest: "nginx-deployment.yml" }
    - { src: "nginx-service.yml.j2", dest: "nginx-service.yml" }

- name: Create demo namespace
  command: kubectl create namespace demo
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: ns_create
  changed_when: "'created' in ns_create.stdout"
  failed_when: >-
    ns_create.rc != 0 and 'AlreadyExists' not in ns_create.stderr

- name: Apply nginx Deployment
  command: kubectl apply -f /tmp/nginx-deployment.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: deploy_apply
  changed_when: "'created' in deploy_apply.stdout or 'configured' in deploy_apply.stdout"

- name: Apply nginx Service (NodePort)
  command: kubectl apply -f /tmp/nginx-service.yml
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: svc_apply
  changed_when: "'created' in svc_apply.stdout or 'configured' in svc_apply.stdout"

- name: Wait for nginx Deployment to become available
  command: >
    kubectl wait --for=condition=Available deployment/nginx
    -n demo --timeout=180s
  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf
  register: nginx_wait
  changed_when: false
  # Workers must be joined and Ready for pods to schedule; retry while they come up
  retries: 3
  delay: 20
  until: nginx_wait.rc == 0

- name: Report nginx access URL
  debug:
    msg: >-
      nginx is accessible at http://<node-public-ip>:{{ nginx_node_port }}
