---
# ─────────────────────────────────────────────────────────────────────────────
# worker/tasks/main.yml
# Joins worker nodes to the cluster using the token generated by the
# control-plane role.
# ─────────────────────────────────────────────────────────────────────────────

- name: Check if node is already joined
  stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_conf

- name: Copy join command to worker node
  copy:
    src: "{{ join_command_local_path }}"
    dest: /tmp/kubeadm_join_command.sh
    mode: "0700"
  when: not kubelet_conf.stat.exists

- name: Join the cluster
  command: bash /tmp/kubeadm_join_command.sh
  when: not kubelet_conf.stat.exists
  register: join_result
  changed_when: true

- name: Remove join command file (contains a bearer token)
  file:
    path: /tmp/kubeadm_join_command.sh
    state: absent

- name: Enable and restart kubelet
  systemd:
    name: kubelet
    state: restarted
    enabled: true
    daemon_reload: true
  when: join_result is changed
