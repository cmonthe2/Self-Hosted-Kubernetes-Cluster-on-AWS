---
- name: Install prerequisites for apt over HTTPS
  apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - lsb-release
      - apt-transport-https
    state: present
    update_cache: true

- name: Create /etc/apt/keyrings directory
  file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker's official GPG key
  get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    force: false

- name: Add Docker apt repository (provides containerd.io)
  apt_repository:
    repo: >-
      deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_distribution_release }} stable
    filename: docker
    state: present

- name: Install containerd.io
  apt:
    name: "containerd.io={{ containerd_version }}"
    state: present
    update_cache: true

- name: Generate default containerd config
  command: containerd config default
  register: containerd_default_config
  changed_when: false

- name: Write containerd config with SystemdCgroup enabled
  copy:
    dest: /etc/containerd/config.toml
    content: >-
      {{ containerd_default_config.stdout |
         regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}
    mode: "0644"
  notify: Restart containerd

- name: Ensure containerd is enabled and started
  systemd:
    name: containerd
    state: started
    enabled: true
    daemon_reload: true
