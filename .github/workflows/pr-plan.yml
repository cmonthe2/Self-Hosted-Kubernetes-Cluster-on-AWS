name: Terraform PR (Plan)

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write   # post plan comment
  id-token: write        # OIDC → AWS

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false   # raw stdout needed for plan capture

      - name: Prep plugin cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -upgrade

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform fmt check
        working-directory: ${{ env.TF_DIR }}
        run: terraform fmt -check -recursive -diff

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        env:
          # allowed_ssh_cidr has a default (0.0.0.0/0) so plan won't prompt.
          # key_name removed — Terraform manages the key pair itself.
          TF_VAR_worker_count: ${{ vars.TF_VAR_WORKER_COUNT }}
        run: |
          set +e
          PLAN_OUT=$(terraform plan -input=false -no-color 2>&1)
          EXIT_CODE=$?
          set -e

          # Write to file for the PR comment step
          echo "$PLAN_OUT" > /tmp/plan_output.txt

          if [ $EXIT_CODE -eq 1 ]; then
            echo "::error::Terraform plan failed"
            exit 1
          fi

      # Security scan — soft-fail so it reports but doesn't block merges
      - name: tfsec security scan
        uses: aquasecurity/tfsec-pr-commenter-action@v1.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tfsec_args: --soft-fail

      # Best-practices lint
      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.51.1

      - name: Run TFLint
        working-directory: ${{ env.TF_DIR }}
        run: |
          tflint --init
          tflint -f compact || true

      # Post plan output as a PR comment
      - name: Post plan comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const plan = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            const MAX  = 60000;
            const body = `## 📝 Terraform Plan — \`terraform/\`

            <details>
            <summary>Show plan output</summary>

            \`\`\`hcl
            ${plan.length > MAX ? plan.slice(0, MAX) + '\n...(truncated)' : plan}
            \`\`\`

            </details>

            > Triggered by commit \`${{ github.event.pull_request.head.sha }}\``;

            // Delete previous bot comment if it exists
            const comments = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.type === 'Bot' && c.body.startsWith('## 📝 Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
