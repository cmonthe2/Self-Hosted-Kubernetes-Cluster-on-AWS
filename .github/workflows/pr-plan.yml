name: Terraform PR (Plan)

on:
  pull_request:
    branches: ["main"]
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write   # post plan comment
  id-token: write        # OIDC → AWS

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # Job 1: Pre-commit checks
  # Runs fast, local checks before spending time on AWS-authenticated steps.
  # ────────────────────────────────────────────────────────────────────────────
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Setup TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.51.1

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  # ────────────────────────────────────────────────────────────────────────────
  # Job 2: Terraform Plan
  # Only runs if pre-commit passes.
  # ────────────────────────────────────────────────────────────────────────────
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    needs: [pre-commit]

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5
          terraform_wrapper: false   # raw stdout needed for plan capture

      - name: Prep plugin cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -upgrade

      - name: Terraform validate
        working-directory: ${{ env.TF_DIR }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: ${{ env.TF_DIR }}
        # always() so the comment posts even if validate failed
        if: always()
        env:
          # worker_count is a Terraform number. TF_VAR_* env vars are strings,
          # so we coerce it explicitly here. Falls back to the variable's own
          # default (2) when the repo variable is not set or is empty.
          TF_VAR_worker_count: ${{ vars.TF_VAR_WORKER_COUNT != '' && vars.TF_VAR_WORKER_COUNT || '2' }}
        run: |
          set +e
          terraform plan -input=false -no-color 2>&1 | tee /tmp/plan_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -eq 1 ]; then
            echo "plan_status=failed" >> "$GITHUB_OUTPUT"
          else
            echo "plan_status=success" >> "$GITHUB_OUTPUT"
          fi

      # Security scan — soft-fail so it annotates the PR without blocking merges
      - name: tfsec security scan
        if: always()
        uses: aquasecurity/tfsec-pr-commenter-action@v1.0.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tfsec_args: --soft-fail

      # Post plan output as a PR comment
      - name: Post plan comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let plan = '_Plan output not available — an earlier step failed before the plan could run._';
            try {
              plan = fs.readFileSync('/tmp/plan_output.txt', 'utf8');
            } catch (_) {}

            const MAX    = 60000;
            const status = '${{ steps.plan.outputs.plan_status }}';
            const icon   = status === 'failed' ? '❌' : '✅';
            const truncated = plan.length > MAX
              ? plan.slice(0, MAX) + '\n...(truncated)'
              : plan;

            const body = [
              `## ${icon} Terraform Plan — \`terraform/\``,
              '',
              '<details>',
              '<summary>Show plan output</summary>',
              '',
              '```hcl',
              truncated,
              '```',
              '',
              '</details>',
              '',
              `> Triggered by commit \`${{ github.event.pull_request.head.sha }}\``,
            ].join('\n');

            // Replace previous bot plan comment if one exists
            const comments = await github.rest.issues.listComments({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
            });
            for (const c of comments.data) {
              if (c.user.type === 'Bot' && c.body.includes('Terraform Plan')) {
                await github.rest.issues.deleteComment({
                  owner:      context.repo.owner,
                  repo:       context.repo.repo,
                  comment_id: c.id,
                });
              }
            }

            await github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

            // Fail the job after posting so the PR shows a red check
            if (status === 'failed') {
              core.setFailed('Terraform plan failed — see comment for details.');
            }
