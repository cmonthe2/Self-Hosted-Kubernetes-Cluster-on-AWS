name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "destroy" to confirm destruction of all resources'
        required: true

permissions:
  contents: read
  id-token: write   # OIDC → AWS

env:
  AWS_REGION: us-east-1
  TF_DIR: terraform

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'destroy'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.8.5

      - name: Prep plugin cache
        run: mkdir -p ~/.terraform.d/plugin-cache

      - name: Terraform init
        working-directory: ${{ env.TF_DIR }}
        run: terraform init -input=false -upgrade

      - name: Terraform destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          # allowed_ssh_cidr not needed here — destroy reads existing state.
          # The variable has a default so Terraform won't prompt.
          TF_VAR_worker_count: ${{ vars.TF_VAR_WORKER_COUNT }}
        run: terraform destroy -input=false -auto-approve
